<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relax music</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* фон только у html, у body прозрачный — иначе он перекрывает видео */
  html { height: 100%; background: #0b0b12; }
  body { margin: 0; height: 100%; overflow: hidden; background: transparent; color: #fff;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }

  /* ===== ФОН: видео на весь экран, почти без затемнения ===== */
  .bg { position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(circle at 20% 10%, #3b1d6e 0%, transparent 50%),
                radial-gradient(circle at 80% 90%, #0e4f6b 0%, transparent 50%), #0b0b12; }
  video.bg-video { position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 1; background: transparent; }
  .shade { position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: linear-gradient(to top, rgba(5,5,12,.55) 0%, rgba(5,5,12,0) 28%); }

  /* ===== НИЖНЯЯ ПЛАШКА ПЛЕЕРА ===== */
  .player { position: fixed; left: 12px; right: 12px; z-index: 5;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    max-width: 440px; margin: 0 auto; padding: 10px 12px 8px; border-radius: 22px;
    background: rgba(12,8,28,.5); border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  .row { display: flex; align-items: center; gap: 12px; }
  .cover { width: 52px; height: 52px; flex: 0 0 52px; border-radius: 12px; object-fit: cover;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); }
  .meta { min-width: 0; flex: 1; }
  .title { font-size: 15px; font-weight: 700; margin: 0 0 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { font-size: 12px; opacity: .65; margin: 0; }

  .controls { display: flex; align-items: center; gap: 8px; }
  .cbtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.08); color: #fff; font-size: 14px; cursor: pointer; transition: transform .15s; }
  .cbtn:active { transform: scale(.9); }
  .cbtn.play { width: 46px; height: 46px; font-size: 18px; border: none;
    background: linear-gradient(135deg, #8b5cf6, #06b6d4); box-shadow: 0 6px 20px rgba(139,92,246,.5); }

  .seekrow { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .seekrow span { font-size: 11px; opacity: .6; min-width: 30px; text-align: center; }
  input[type=range] { flex: 1; width: 100%; accent-color: #a78bfa; margin: 0; }

  /* ===== КНОПКА-ЯЗЫЧОК ДЛЯ БОКОВОГО ВИДЖЕТА ===== */
  .handle { position: fixed; right: 0; top: 38%; z-index: 6; width: 38px; padding: 16px 0;
    border-radius: 16px 0 0 16px; border: 1px solid rgba(250,204,21,.55); border-right: none;
    background: linear-gradient(180deg, rgba(139,92,246,.85), rgba(6,182,212,.7));
    box-shadow: 0 0 22px rgba(168,85,247,.55); color: #fff; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    font: inherit; font-size: 12px; font-weight: 700; letter-spacing: 2px;
    transition: transform .25s, opacity .25s; }
  .handle .ic { font-size: 17px; }
  .handle .txt { writing-mode: vertical-rl; text-transform: uppercase; }
  body.open .handle { transform: translateX(100%); opacity: 0; pointer-events: none; }

  /* ===== БОКОВОЙ ВИДЖЕТ ===== */
  .backdrop { position: fixed; inset: 0; z-index: 7; background: rgba(0,0,0,.35);
    opacity: 0; pointer-events: none; transition: opacity .28s; }
  body.open .backdrop { opacity: 1; pointer-events: auto; }

  .drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 8; width: min(86vw, 340px);
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 12px calc(env(safe-area-inset-bottom, 0px) + 14px);
    display: flex; flex-direction: column;
    background: rgba(14,9,30,.78); border-left: 1px solid rgba(250,204,21,.35);
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    box-shadow: -10px 0 40px rgba(0,0,0,.5), -2px 0 24px rgba(139,92,246,.25);
    transform: translateX(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1); }
  body.open .drawer { transform: none; }

  .dhead { display: flex; align-items: center; justify-content: space-between; margin: 0 4px 10px; }
  .dhead b { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; opacity: .85; }
  .close { width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.08); color: #fff; font-size: 16px; cursor: pointer; }

  /* кнопки-категории (вертикально внутри панели) */
  .tabs { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .tab { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 14px;
    color: #fff; font: inherit; font-size: 14px; font-weight: 600; text-align: left; cursor: pointer;
    border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.07);
    transition: transform .2s, box-shadow .2s, background .2s, border-color .2s; }
  .tab .ic { font-size: 18px; }
  .tab:active { transform: scale(.97); }
  .tab.active { border-color: rgba(250,204,21,.8);
    background: linear-gradient(135deg, rgba(139,92,246,.85), rgba(6,182,212,.7));
    box-shadow: 0 0 0 1px rgba(250,204,21,.3), 0 6px 22px rgba(139,92,246,.5); }

  .list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
    padding-right: 2px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .list::-webkit-scrollbar { display: none; }
  .list.slideL { animation: slideL .28s ease; }
  .list.slideR { animation: slideR .28s ease; }
  @keyframes slideL { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
  @keyframes slideR { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: none; } }
  .item { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 14px; flex: 0 0 auto;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); cursor: pointer; }
  .item.active { background: rgba(139,92,246,.4); border-color: rgba(250,204,21,.5); }
  .item img { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; }
  .item b { display: block; font-size: 14px; }
  .item span { font-size: 12px; opacity: .6; }
  .empty { text-align: center; opacity: .6; padding: 30px 0; font-size: 14px; }
</style>
</head>
<body>
  <div class="bg"></div>
  <video id="bgv" class="bg-video" autoplay muted loop playsinline webkit-playsinline preload="auto" src="bg.mp4"></video>
  <div class="shade"></div>

  <!-- плеер -->
  <div class="player">
    <div class="row">
      <img id="cover" class="cover" alt="">
      <div class="meta">
        <div id="title" class="title"></div>
        <div id="artist" class="artist"></div>
      </div>
      <div class="controls">
        <button class="cbtn" id="prev">⏮</button>
        <button class="cbtn play" id="play">▶</button>
        <button class="cbtn" id="next">⏭</button>
      </div>
    </div>
    <div class="seekrow">
      <span id="cur">0:00</span>
      <input id="seek" type="range" min="0" max="100" value="0" step="0.1">
      <span id="dur">0:00</span>
    </div>
  </div>

  <!-- язычок справа -->
  <button class="handle" id="handle"><span class="ic">🎵</span><span class="txt">Плейлист</span></button>

  <!-- боковой виджет -->
  <div class="backdrop" id="backdrop"></div>
  <aside class="drawer" id="drawer">
    <div class="dhead"><b>Плейлисты</b><button class="close" id="close">✕</button></div>
    <div class="tabs" id="tabs"></div>
    <div class="list" id="list"></div>
  </aside>

  <audio id="audio" preload="metadata"></audio>

<script>
  // === ФОНОВОЕ ВИДЕО: принудительный запуск (на телефонах автоплей иногда блокируется) ===
  const bgv = document.getElementById("bgv");
  bgv.muted = true;
  const startBg = () => { const p = bgv.play(); if (p && p.catch) p.catch(() => {}); };
  startBg();
  bgv.addEventListener("loadeddata", startBg);
  ["touchstart", "click"].forEach(ev => document.addEventListener(ev, startBg, { once: true, passive: true }));

  // === КАТЕГОРИИ ===
  const CATS = [
    { id: "kayf", icon: "🔥", name: "Музыка для кайфа под крутку" },
    { id: "sad",  icon: "🌧️", name: "Музыка погрустить" },
    { id: "new",  icon: "⚡", name: "Музыка новой школы" },
    { id: "psy",  icon: "🤪", name: "Музыка для психов" }
  ];
  const ALL = ["kayf", "sad", "new", "psy"];

  // === ТВОИ ТРЕКИ ===
  // cats — в каких категориях трек показывается: "kayf", "sad", "new", "psy"
  const TRACKS = [
    { title: "Brutal City", artist: "Deep", src: "music/brutalcitydeep.mp3", cover: "covers/brutalcitydeep.jpg", cats: ALL },
    { title: "Stronghold", artist: "Deep", src: "music/strongholddeep.mp3", cover: "covers/strongholddeep.jpg", cats: ALL },
    { title: "Ghost", artist: "Deep", src: "music/ghostdeep.mp3", cover: "covers/ghostdeep.jpg", cats: ALL },
    { title: "God Bless", artist: "Deep", src: "music/godblessdeep.mp3", cover: "covers/godblessdeep.jpg", cats: ALL },
    { title: "Casablanca", artist: "Deep", src: "music/castablanca.mp3", cover: "covers/castablanca.jpg", cats: ALL },
    { title: "We Don't Stop", artist: "MONYX", src: "music/monyxwedontstop.m4a", cover: "covers/monyxwedontstop.jpg", cats: ALL },
    { title: "Processor (Original Mix)", artist: "PNZ", src: "music/pnzprocessor.m4a", cover: "covers/pnzprocessor.jpg", cats: ALL }
  ];

  const tg = window.Telegram.WebApp;
  tg.ready(); tg.expand();
  tg.setHeaderColor("#0b0b12"); tg.setBackgroundColor("#0b0b12");
  tg.BackButton.show();
  tg.BackButton.onClick(() => {
    if (document.body.classList.contains("open")) setDrawer(false);
    else location.href = "index.html";
  });

  const $ = id => document.getElementById(id);
  const audio = $("audio"), seek = $("seek"), playBtn = $("play");
  let g = 0;     // играющий трек (индекс в TRACKS)
  let cat = 0;   // выбранная категория

  const fmt = s => isNaN(s) ? "0:00" : Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
  const queue = () => TRACKS.map((t, idx) => idx).filter(idx => TRACKS[idx].cats.includes(CATS[cat].id));

  // --- боковая панель ---
  function setDrawer(open) { document.body.classList.toggle("open", open); }
  $("handle").onclick = () => setDrawer(true);
  $("close").onclick = () => setDrawer(false);
  $("backdrop").onclick = () => setDrawer(false);

  // свайп: от правого края влево — открыть; по панели вправо — закрыть
  let sx = 0, sy = 0, fromEdge = false;
  document.addEventListener("touchstart", e => {
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    fromEdge = sx > window.innerWidth - 28;
  }, { passive: true });
  document.addEventListener("touchend", e => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    const isOpen = document.body.classList.contains("open");
    if (!isOpen && fromEdge && dx < 0) setDrawer(true);
    else if (isOpen && dx > 0 && e.target.closest(".drawer") && !e.target.closest(".list")) setDrawer(false);
  }, { passive: true });
  // свайп по самому списку — смена категории
  $("list").addEventListener("touchend", e => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) setCat(cat + (dx < 0 ? 1 : -1));
  }, { passive: true });

  // --- категории и список ---
  function renderTabs() {
    $("tabs").innerHTML = "";
    CATS.forEach((c, idx) => {
      const b = document.createElement("button");
      b.className = "tab" + (idx === cat ? " active" : "");
      b.innerHTML = `<span class="ic">${c.icon}</span><span>${c.name}</span>`;
      b.onclick = () => setCat(idx);
      $("tabs").appendChild(b);
    });
  }

  function renderList(dir) {
    const list = $("list");
    list.innerHTML = "";
    const q = queue();
    if (!q.length) list.innerHTML = '<div class="empty">Тут пока пусто 🎧</div>';
    q.forEach(idx => {
      const t = TRACKS[idx];
      const el = document.createElement("div");
      el.className = "item" + (idx === g ? " active" : "");
      el.innerHTML = `<img src="${t.cover}" alt=""><div><b>${t.title}</b><span>${t.artist}</span></div>`;
      el.onclick = () => { load(idx, true); setDrawer(false); };
      list.appendChild(el);
    });
    list.classList.remove("slideL", "slideR");
    if (dir) { void list.offsetWidth; list.classList.add(dir > 0 ? "slideL" : "slideR"); }
  }

  function setCat(idx) {
    if (idx < 0 || idx >= CATS.length || idx === cat) return;
    const dir = idx > cat ? 1 : -1;
    cat = idx;
    renderTabs();
    renderList(dir);
  }

  // --- плеер ---
  function load(idx, autoplay) {
    g = (idx + TRACKS.length) % TRACKS.length;
    const t = TRACKS[g];
    audio.src = t.src;
    $("cover").src = t.cover;
    $("title").textContent = t.title;
    $("artist").textContent = t.artist;
    seek.value = 0;
    renderList();
    if ("mediaSession" in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: t.title, artist: t.artist, artwork: [{ src: t.cover }]
      });
    }
    if (autoplay) audio.play();
  }

  // вперёд / назад — внутри выбранной категории
  function step(d) {
    const q = queue();
    if (!q.length) return;
    let pos = q.indexOf(g);
    if (pos === -1) pos = d > 0 ? -1 : 0;
    load(q[(pos + d + q.length) % q.length], true);
  }

  playBtn.onclick = () => audio.paused ? audio.play() : audio.pause();
  $("next").onclick = () => step(1);
  $("prev").onclick = () => step(-1);

  audio.onplay = () => playBtn.textContent = "⏸";
  audio.onpause = () => playBtn.textContent = "▶";
  audio.onended = () => step(1);
  audio.onloadedmetadata = () => $("dur").textContent = fmt(audio.duration);
  audio.ontimeupdate = () => {
    if (audio.duration) seek.value = (audio.currentTime / audio.duration) * 100;
    $("cur").textContent = fmt(audio.currentTime);
  };
  seek.oninput = () => { if (audio.duration) audio.currentTime = (seek.value / 100) * audio.duration; };

  if ("mediaSession" in navigator) {
    navigator.mediaSession.setActionHandler("nexttrack", () => step(1));
    navigator.mediaSession.setActionHandler("previoustrack", () => step(-1));
  }

  renderTabs();
  load(0, false);
</script>
</body>
</html>
