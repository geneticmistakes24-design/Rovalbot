<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relax music</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0b0b12; color: #fff;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }

  .bg { position: fixed; inset: 0; z-index: -2;
    background: radial-gradient(circle at 20% 10%, #3b1d6e 0%, transparent 50%),
                radial-gradient(circle at 80% 90%, #0e4f6b 0%, transparent 50%), #0b0b12; }
  video.bg-video { position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: -2; }
  .shade { position: fixed; inset: 0; z-index: -1; background: rgba(5,5,12,.6); }

  .wrap { min-height: 100%; max-width: 440px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + 24px) 20px 30px; }

  .cover { width: 100%; aspect-ratio: 1; border-radius: 24px; object-fit: cover;
    background: rgba(255,255,255,.08); box-shadow: 0 20px 50px rgba(0,0,0,.5); display: block; }
  .title { font-size: 22px; font-weight: 700; margin: 20px 0 4px; }
  .artist { font-size: 15px; opacity: .65; margin: 0 0 18px; }

  input[type=range] { width: 100%; accent-color: #8b5cf6; margin: 0; }
  .times { display: flex; justify-content: space-between; font-size: 12px; opacity: .6; margin-top: 4px; }

  .controls { display: flex; align-items: center; justify-content: center; gap: 28px; margin: 18px 0 26px; }
  .cbtn { width: 56px; height: 56px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.08); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    color: #fff; font-size: 20px; cursor: pointer; transition: transform .15s; }
  .cbtn:active { transform: scale(.92); }
  .cbtn.play { width: 72px; height: 72px; font-size: 28px; border: none;
    background: linear-gradient(135deg, #8b5cf6, #06b6d4); box-shadow: 0 8px 30px rgba(139,92,246,.45); }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 14px;
    background: rgba(255,255,255,.06); cursor: pointer; }
  .item.active { background: rgba(139,92,246,.3); }
  .item img { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; }
  .item b { display: block; font-size: 14px; }
  .item span { font-size: 12px; opacity: .6; }
</style>
</head>
<body>
  <div class="bg"></div>
  <video class="bg-video" autoplay muted loop playsinline src="bg.mp4"
         onerror="this.remove()"></video>
  <div class="shade"></div>

  <div class="wrap">
    <img id="cover" class="cover" alt="">
    <div id="title" class="title"></div>
    <div id="artist" class="artist"></div>

    <input id="seek" type="range" min="0" max="100" value="0" step="0.1">
    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>

    <div class="controls">
      <button class="cbtn" id="prev">⏮</button>
      <button class="cbtn play" id="play">▶</button>
      <button class="cbtn" id="next">⏭</button>
    </div>

    <div class="list" id="list"></div>
  </div>

  <audio id="audio" preload="metadata"></audio>

<script>
  // === ТВОИ ТРЕКИ ===
  const TRACKS = [
    { title: "Название трека 1", artist: "Исполнитель", src: "music/track1.mp3", cover: "covers/track1.jpg" },
    { title: "Название трека 2", artist: "Исполнитель", src: "music/track2.mp3", cover: "covers/track2.jpg" }
  ];

  const tg = window.Telegram.WebApp;
  tg.ready(); tg.expand();
  tg.setHeaderColor("#0b0b12"); tg.setBackgroundColor("#0b0b12");
  tg.BackButton.show();
  tg.BackButton.onClick(() => { location.href = "index.html"; });

  const $ = id => document.getElementById(id);
  const audio = $("audio"), seek = $("seek"), playBtn = $("play");
  let i = 0;

  const fmt = s => isNaN(s) ? "0:00" : Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");

  function renderList() {
    $("list").innerHTML = "";
    TRACKS.forEach((t, idx) => {
      const el = document.createElement("div");
      el.className = "item" + (idx === i ? " active" : "");
      el.innerHTML = `<img src="${t.cover}" alt=""><div><b>${t.title}</b><span>${t.artist}</span></div>`;
      el.onclick = () => load(idx, true);
      $("list").appendChild(el);
    });
  }

  function load(idx, autoplay) {
    i = (idx + TRACKS.length) % TRACKS.length;
    const t = TRACKS[i];
    audio.src = t.src;
    $("cover").src = t.cover;
    $("title").textContent = t.title;
    $("artist").textContent = t.artist;
    seek.value = 0;
    renderList();
    if ("mediaSession" in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: t.title, artist: t.artist, artwork: [{ src: t.cover }]
      });
    }
    if (autoplay) audio.play();
  }

  playBtn.onclick = () => audio.paused ? audio.play() : audio.pause();
  $("next").onclick = () => load(i + 1, true);
  $("prev").onclick = () => load(i - 1, true);

  audio.onplay = () => playBtn.textContent = "⏸";
  audio.onpause = () => playBtn.textContent = "▶";
  audio.onended = () => load(i + 1, true);
  audio.onloadedmetadata = () => $("dur").textContent = fmt(audio.duration);
  audio.ontimeupdate = () => {
    if (audio.duration) seek.value = (audio.currentTime / audio.duration) * 100;
    $("cur").textContent = fmt(audio.currentTime);
  };
  seek.oninput = () => { if (audio.duration) audio.currentTime = (seek.value / 100) * audio.duration; };

  if ("mediaSession" in navigator) {
    navigator.mediaSession.setActionHandler("nexttrack", () => load(i + 1, true));
    navigator.mediaSession.setActionHandler("previoustrack", () => load(i - 1, true));
  }

  load(0, false);
</script>
</body>
</html>
