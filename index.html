<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ресурсы бота</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0b0b12; color: #fff;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

  .bg { position: fixed; inset: 0; z-index: -2;
    background: radial-gradient(circle at 20% 10%, #3b1d6e 0%, transparent 50%),
                radial-gradient(circle at 80% 90%, #0e4f6b 0%, transparent 50%), #0b0b12; }
  video.bg-video { position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: -2; }
  .shade { position: fixed; inset: 0; z-index: -1; background: rgba(5,5,12,.55); }

  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center;
    padding: calc(env(safe-area-inset-top, 0px) + 40px) 20px 30px; }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: .5px; margin: 0 0 28px;
    text-shadow: 0 2px 20px rgba(0,0,0,.6); }
  .stack { width: 100%; max-width: 420px; display: flex; flex-direction: column;
    gap: 14px; margin: auto 0; }

  .btn { display: flex; align-items: center; justify-content: center; text-align: center;
    border: 1px solid rgba(255,255,255,.18); border-radius: 18px; color: #fff;
    font-weight: 600; cursor: pointer;
    background: rgba(255,255,255,.08); backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px); transition: transform .15s, background .15s; }
  .btn:active { transform: scale(.96); background: rgba(255,255,255,.16); }

  .main { height: 84px; font-size: 20px;
    background: linear-gradient(135deg, #8b5cf6, #06b6d4); border: none;
    box-shadow: 0 8px 30px rgba(139,92,246,.45); }
  .row { display: flex; gap: 14px; }
  .row .btn { flex: 1; height: 64px; font-size: 15px; padding: 0 8px; }
  .music { height: 60px; font-size: 16px; }
</style>
</head>
<body>
  <div class="bg"></div>
  <video class="bg-video" autoplay muted loop playsinline src="bg.mp4"
         onerror="this.remove()"></video>
  <div class="shade"></div>

  <div class="wrap">
    <h1>Ресурсы бота:</h1>
    <div class="stack">
      <div class="btn main" data-type="ext" data-url="https://shuffle.vip?r=wc4omO8oy5">🎰 Tier 1 casino Shuffle</div>
      <div class="row">
        <div class="btn" data-type="tg" data-url="https://t.me/rovelcommunity">📢 Канал Rovel'я</div>
        <div class="btn" data-type="tg" data-url="https://t.me/rovelcommunitychat">💬 Чат Rovel'я</div>
      </div>
      <div class="btn music" data-type="page" data-url="player.html">🎧 relax music for game</div>
    </div>
  </div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();
  tg.setHeaderColor("#0b0b12");
  tg.setBackgroundColor("#0b0b12");

  document.querySelectorAll(".btn").forEach(el => {
    el.addEventListener("click", () => {
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
      const url = el.dataset.url, type = el.dataset.type;
      if (type === "tg") tg.openTelegramLink(url);
      else if (type === "ext") tg.openLink(url);
      else location.href = url;
    });
  });
</script>
</body>
</html>
