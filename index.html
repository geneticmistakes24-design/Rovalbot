<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ресурсы бота</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --u: min(100vw, 480px);
    --fm: clamp(8px, 2.6vw, 14px);
    --fw: calc(var(--u) - var(--fm) * 2);
    --decor: min(calc(var(--fw) * .596), 36vh);
    --font: "Oswald", "Bebas Neue", "Arial Narrow", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: #150a20; }
  body { font-family: var(--font); overflow-x: hidden; }

  /* ФОН: боке */
  .bg { position: fixed; inset: 0; overflow: hidden; z-index: 0;
    background: linear-gradient(180deg, #24132f 0%, #170c23 45%, #150a20 100%); }
  .bg i { position: absolute; border-radius: 50%; display: block; }
  .b1 { left: 38%; top: -6%; width: 48vmin; height: 36vmin; filter: blur(14px);
    background: radial-gradient(circle, rgba(140,20,200,.6), transparent 68%); }
  .b2 { left: -12%; top: 22%; width: 52vmin; height: 40vmin; filter: blur(16px);
    background: radial-gradient(circle, rgba(120,18,170,.55), transparent 68%); }
  .b3 { right: -10%; top: 26%; width: 40vmin; height: 40vmin; filter: blur(7px);
    border: 5vmin solid rgba(214,168,104,.30); }
  .b4 { left: -8%; bottom: 10%; width: 46vmin; height: 46vmin; filter: blur(14px);
    background: radial-gradient(circle, rgba(205,150,80,.40), transparent 68%); }
  .b5 { left: 50%; bottom: -10%; width: 110vmin; height: 60vmin; transform: translateX(-50%); filter: blur(18px);
    background: radial-gradient(ellipse, rgba(170,120,60,.40), transparent 68%); }

  /* РАМКА + ДЕКОР: кубики, фишки, карты, алмаз */
  .frame { position: fixed; z-index: 1; pointer-events: none; overflow: hidden;
    left: 50%; width: var(--fw); transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + var(--fm)); bottom: calc(env(safe-area-inset-bottom, 0px) + var(--fm));
    border-radius: calc(var(--u) * .065);
    background: linear-gradient(180deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,0) 32%);
    box-shadow: 0 0 calc(var(--u) * .05) rgba(170,80,255,.35), inset 0 0 calc(var(--u) * .08) rgba(170,80,255,.14); }
  .frame::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: max(1.5px, calc(var(--u) * .005));
    background: linear-gradient(150deg, #b86bff 0%, rgba(184,107,255,.7) 35%, rgba(232,194,122,.8) 70%, #e8c27a 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
  .decor { position: absolute; left: 0; right: 0; bottom: 0; height: var(--decor);
    background: url("decor-frame.jpg") center bottom / cover no-repeat;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 30%), linear-gradient(to right, transparent 0, #000 6%, #000 94%, transparent 100%);
    -webkit-mask-composite: source-in;
            mask-image: linear-gradient(to bottom, transparent 0, #000 30%), linear-gradient(to right, transparent 0, #000 6%, #000 94%, transparent 100%);
            mask-composite: intersect; }

  /* КОНТЕНТ */
  .wrap { position: relative; z-index: 2; width: var(--u); min-height: 100vh; min-height: 100dvh; margin: 0 auto;
    display: flex; flex-direction: column; align-items: center;
    padding: calc(env(safe-area-inset-top, 0px) + var(--fm) + var(--u) * .1) 0 calc(var(--decor) * .86 + var(--fm) + env(safe-area-inset-bottom, 0px)); }

  .gold { background: linear-gradient(180deg, #f8e6b8 0%, #dcb56f 50%, #a07440 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }

  h1 { margin: 0; font-family: var(--font); font-weight: 600; font-size: calc(var(--u) * .1); letter-spacing: .01em;
    text-align: center; line-height: 1.1;
    filter: drop-shadow(0 0 10px rgba(232,170,80,.45)) drop-shadow(0 2px 2px rgba(0,0,0,.7)); }

  .stack { width: 89%; margin: auto 0; padding-top: calc(var(--u) * .05); display: flex; flex-direction: column; gap: calc(var(--u) * .045); }
  .row { display: flex; gap: calc(var(--u) * .03); }
  .row .btn { flex: 1 1 0; }

  .btn { --bw: max(1.5px, calc(var(--u) * .004));
    position: relative; flex: none; min-width: 0; display: flex; align-items: center; justify-content: center;
    gap: calc(var(--u) * .03); text-align: center; cursor: pointer; user-select: none; -webkit-user-select: none;
    border-radius: calc(var(--u) * .06);
    background: linear-gradient(165deg, rgba(255,255,255,.13) 0%, rgba(255,255,255,.04) 35%, rgba(18,10,28,.62) 100%);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    box-shadow: 0 0 calc(var(--u) * .04) rgba(170,80,255,.38), inset 0 0 calc(var(--u) * .05) rgba(170,80,255,.12), 0 10px 22px rgba(0,0,0,.45);
    transition: transform .12s ease, filter .12s ease;
    opacity: 0; animation: rise .5s ease forwards; }
  .btn::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: var(--bw); pointer-events: none;
    background: linear-gradient(135deg, #c970ff 0%, rgba(255,255,255,.2) 30%, rgba(232,194,122,.75) 55%, #c970ff 80%, #e8c27a 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
  .btn::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(120deg, rgba(255,255,255,.14) 0%, transparent 42%); }
  .btn:active { transform: scale(.97); filter: brightness(1.2); }
  .btn:focus-visible { outline: 2px solid #e8c27a; outline-offset: 3px; }
  .btn:nth-child(2), .row .btn:first-child { animation-delay: .08s; }
  .row .btn.buy { animation-delay: .11s; }
  .row .btn:last-child { animation-delay: .14s; }
  .music { animation-delay: .2s; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .btn { animation: none; opacity: 1; } }

  .btn svg { flex: none; fill: none; stroke: #c77dff; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 0 5px rgba(190,100,255,.8)); }
  .btn span { font-family: var(--font); font-weight: 600; line-height: 1.1;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.65)); }

  .main { height: calc(var(--u) * .215); }
  .main svg { width: calc(var(--u) * .085); height: calc(var(--u) * .085); }
  .main span { font-size: calc(var(--u) * .062); }

  .half { height: calc(var(--u) * .27); flex-direction: column; gap: calc(var(--u) * .02); }
  .half svg { width: calc(var(--u) * .085); height: calc(var(--u) * .085); }
  .half span { font-size: calc(var(--u) * .05); line-height: 1.08; padding: 0 2px; }
  .row .btn.buy { flex: 1.18 1 0;
    background: linear-gradient(165deg, rgba(232,194,122,.30) 0%, rgba(150,70,200,.30) 55%, rgba(18,10,28,.62) 100%);
    box-shadow: 0 0 calc(var(--u) * .05) rgba(232,170,80,.45), inset 0 0 calc(var(--u) * .05) rgba(232,170,80,.14), 0 10px 22px rgba(0,0,0,.45); }

  .music { height: calc(var(--u) * .095); border-radius: calc(var(--u) * .04); }
  .music svg { width: calc(var(--u) * .055); height: calc(var(--u) * .055); }
  .music span { font-size: calc(var(--u) * .045); }

  .news { height: calc(var(--u) * .13); border-radius: calc(var(--u) * .05); animation-delay: .26s; }
  .news svg { width: calc(var(--u) * .07); height: calc(var(--u) * .07); }
  .news span { font-size: calc(var(--u) * .055); }

  @media (max-height: 620px) { .wrap { padding-top: calc(env(safe-area-inset-top, 0px) + var(--fm) + 14px); } }
</style>
</head>
<body>
  <div class="bg"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i><i class="b5"></i></div>
  <div class="frame"><div class="decor"></div></div>

  <div class="wrap">
    <h1 class="gold">Ресурсы бота:</h1>

    <div class="stack">
      <div class="btn main" tabindex="0" role="link" data-type="page" data-url="invest.html">
        <svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-9"/><path d="M14 6h7v7"/></svg>
        <span class="gold">INVEST</span>
      </div>

      <div class="btn main" tabindex="0" role="link" data-type="ext" data-url="SHUFFLE">
        <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span class="gold">Tier 1 casino Shuffle</span>
      </div>

      <div class="row">
        <div class="btn half" tabindex="0" role="link" data-type="tg" data-url="https://t.me/rovelcommunity">
          <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          <span class="gold">Канал<br>Rovel’я</span>
        </div>
        <div class="btn half buy" tabindex="0" role="link" data-type="page" data-url="pay.html">
          <svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M3 4h2.5l2.2 11h10.6l2-8H6.4"/></svg>
          <span class="gold">BUY<br>CLAIMER</span>
        </div>
        <div class="btn half" tabindex="0" role="link" data-type="tg" data-url="https://t.me/rovelcommunitychat">
          <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.5A8 8 0 1 1 21 12z"/></svg>
          <span class="gold">Чат<br>Rovel’я</span>
        </div>
      </div>

      <div class="btn music" tabindex="0" role="link" data-type="page" data-url="player.html">
        <svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>
        <span class="gold">relax music for game</span>
      </div>

      <div class="btn news" tabindex="0" role="link" data-type="page" data-url="news.html">
        <svg viewBox="0 0 24 24"><path d="M4 5h13v13a2 2 0 0 0 2 2H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v9a2 2 0 0 1-2 2"/><path d="M7 9h7M7 12h7M7 15h4"/></svg>
        <span class="gold">Новости игровой сферы</span>
      </div>
    </div>
  </div>

<script>
  const SHUFFLE_URL = "https://shuffle.vip?r=wc4omO8oy5";

  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    tg.setHeaderColor("#1c0f2a");
    tg.setBackgroundColor("#150a20");
  }

  document.querySelectorAll(".btn").forEach(el => {
    const go = () => {
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
      const type = el.dataset.type;
      const url = el.dataset.url === "SHUFFLE" ? SHUFFLE_URL : el.dataset.url;
      if (type === "tg") (tg ? tg.openTelegramLink(url) : window.open(url, "_blank"));
      else if (type === "ext") (tg ? tg.openLink(url) : window.open(url, "_blank"));
      else location.href = url;
    };
    el.addEventListener("click", go);
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });
</script>
</body>
</html>
